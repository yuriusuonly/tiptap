<!DOCTYPE html>
<html>
  <head>
    <base href="/"/>
    <meta charset="UTF-8"/>
    <meta content="IE=Edge" http-equiv="X-UA-Compatible"/>
    <meta name="description" content="Tap. Learn. Impress. — Page not found"/>
    <meta name="robots" content="noindex"/>

    <meta name="mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TipTap"/>
    <link rel="apple-touch-icon" href="/icon-192.png">

    <link rel="icon" type="image/svg+xml" href="/icon.svg"/>
    <link rel="manifest" href="/manifest.json"/>

    <title>Page not found — TipTap</title>
    <style>
      :root {
        color-scheme: light dark;
        --primary: #607d8b;
        --bg: #ffffff;
        --fg: #0f1417;
        --muted: #465158;
        --card: #f2f5f6;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #101416;
          --fg: #ecefee;
          --muted: #b8c2c7;
          --card: #1a2125;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: Outfit, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--fg);
        display: grid;
        place-items: center;
        padding: 40px 24px;
        text-align: center;
      }
      main { max-width: 560px; }
      .brand { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; }
      .tagline { color: var(--muted); margin: 6px 0 28px; font-size: 16px; }
      .code {
        display: inline-grid;
        place-items: center;
        width: 88px; height: 88px;
        border-radius: 24px;
        background: var(--card);
        border: 1px solid color-mix(in srgb, var(--primary) 30%, transparent);
        font-size: 34px; font-weight: 800;
        margin: 8px auto 20px;
        box-shadow: 0 12px 32px color-mix(in srgb, var(--primary) 22%, transparent);
      }
      h1 { font-size: 40px; margin: 0 0 10px; letter-spacing: -0.03em; }
      p { margin: 0 auto 26px; color: var(--muted); font-size: 16px; line-height: 1.6; max-width: 42ch; }
      .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
      a.btn {
        display: inline-flex; align-items: center; justify-content: center;
        min-height: 48px; padding: 0 20px;
        border-radius: 12px; text-decoration: none; font-weight: 700; font-size: 14px;
        border: 1px solid var(--primary);
      }
      a.primary { background: var(--primary); color: #fff; }
      a.secondary { background: transparent; color: var(--fg); }
      footer { margin-top: 40px; font-size: 13px; color: var(--muted); display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
      footer a { color: var(--muted); }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">TipTap</div>
      <div class="tagline">Tap. Learn. Impress.</div>
      <div class="code" aria-hidden="true">404</div>
      <h1>Page not found</h1>
      <p>The page you’re looking for doesn’t exist or has moved.</p>
      <div class="actions">
        <a class="btn primary" href="/">Go to home</a>
        <a class="btn secondary" href="/privacy">Privacy</a>
        <a class="btn secondary" href="/terms">Terms</a>
      </div>
      <footer>
        <span>©2026 TipTap</span>
        <span>•</span>
        <a href="/privacy">Privacy</a>
        <span>•</span>
        <a href="/terms">Terms</a>
      </footer>
    </main>
  </body>
</html>
